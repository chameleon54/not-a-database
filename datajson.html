<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <title>Manajemen Data Barang</title>
 <link rel="stylesheet" href="/assets/CSS/style.css">
</head>

<body>
<button id="themeToggle" class="theme-toggle">🌙 Dark Mode</button>
<h2>Manajemen Data Barang</h2>

<div class="container">

    <!-- search -->
    <input type="text" id="searchInput" placeholder="Cari barang...">

    <div class="export-buttons">
    <button id="exportExcel">Export Excel</button>
    <button id="exportCSV">Export CSV</button>
    </div>


    <!-- Form -->
    <form id="dataForm">
        <input type="text" id="kode_barang" placeholder="Kode Barang" required>
        <input type="text" id="nama_barang" placeholder="Nama Barang" required>
        <input type="text" id="harga_perolehan" placeholder="Harga Perolehan" required onkeyup="formatInputNumber(this)">
        <input type="text" id="harga_jual" placeholder="Harga Jual" required onkeyup="formatInputNumber(this)">
        <input type="number" id="jumlah_stock" placeholder="Jumlah Stock" required>
        <input type="text" id="suplier_utama" placeholder="Suplier Utama" required>

        <button type="submit">Tambah Data</button>
    </form>
    
    <div id="tableContainer" style="position: relative; min-height: 200px;">
    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Memuat data...</p>
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>Kode Barang</th>
                <th>Nama Barang</th>
                <th>Harga Perolehan</th>
                <th>Harga Jual</th>
                <th>Jumlah Stock</th>
                <th>Suplier Utama</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>


<!-- Modal Edit -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Data Barang</h3>

    <form id="editForm">
        <input type="text" id="edit_kode_barang" placeholder="Kode Barang" required>
        <input type="text" id="edit_nama_barang" placeholder="Nama Barang" required>
        <input type="number" id="edit_harga_perolehan" placeholder="Harga Perolehan" required>
        <input type="number" id="edit_harga_jual" placeholder="Harga Jual" required>
        <input type="number" id="edit_jumlah_stock" placeholder="Jumlah Stock" required>
        <input type="text" id="edit_suplier_utama" placeholder="Suplier Utama" required>

        <button type="submit" class="save-btn">Simpan Perubahan</button>
        <button type="button" class="close-btn" onclick="tutupModal()">Batal</button>
    </form>
  </div>
</div>

<script src="/assets/JS/script.js"></script>
<div id="toastContainer"></div>

</body>
</html>
