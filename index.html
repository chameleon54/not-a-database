<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <title>Manajemen Data Barang</title>
 <link rel="stylesheet" href="/assets/CSS/style.css">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<!-- SPLASH SCREEN PREMIUM -->
<div id="splashPremium" class="splash-screen-premium">

    <!-- Floating particles -->
    <div class="splash-particle" style="left:20%; animation-duration:4s;"></div>
    <div class="splash-particle" style="left:60%; animation-duration:5s;"></div>
    <div class="splash-particle" style="left:40%; animation-duration:3.2s;"></div>

    <!-- Spotlight shine -->
    <div class="splash-shine"></div>

    <!-- Content wrapper -->
    <div class="splash-wrapper">

    <svg id="premiumLogo" width="120" height="120" viewBox="0 0 120 120">
        <path id="premiumPath"
        d="
        M20 40 L60 20 L100 40 L100 80 L60 100 L20 80 Z 
        M20 40 L60 60 L100 40
        M60 60 L60 100
        "
        fill="none"
        stroke="white"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        />
     </svg>

        <!-- Title -->
        <h1 class="splash-title">Manajemen Barang</h1>

        <!-- Subtitle -->
        <p class="splash-subtitle">Fast • Modern • Efficient</p>

    </div>
</div>
<!-- END SPLASH -->


<button id="themeToggle" class="theme-toggle">🌙 Dark Mode</button>
<h2>Manajemen Data Barang</h2>

<div class="container">


    <!-- search -->
    <input type="text" id="searchInput" placeholder="Cari barang...">

    <div class="export-buttons">
    <button id="exportExcel">Export Excel</button>
    <button id="exportCSV">Export CSV</button>
    </div>


    <!-- Form -->
    <form id="dataForm">
        <input type="text" id="kode_barang" placeholder="Kode Barang" required>
        <input type="text" id="nama_barang" placeholder="Nama Barang" required>
        <input type="text" id="harga_perolehan" placeholder="Harga Perolehan" required onkeyup="formatInputNumber(this)">
        <input type="text" id="harga_jual" placeholder="Harga Jual" required onkeyup="formatInputNumber(this)">
        <input type="number" id="jumlah_stock" placeholder="Jumlah Stock" required>
        <input type="text" id="suplier_utama" placeholder="Suplier Utama" required>

        <button type="submit">Tambah Data</button>
    </form>
    
    <div id="tableContainer" style="position: relative; min-height: 200px;">
    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Memuat data...</p>
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th class="sortable" data-key="kode_barang">Kode Barang</th>
                <th class="sortable" data-key="nama_barang">Nama Barang</th>
                <th class="sortable" data-key="harga_perolehan">Harga Perolehan</th>
                <th class="sortable" data-key="harga_jual">Harga Jual</th>
                <th class="sortable" data-key="jumlah_stock">Jumlah Stock</th>
                <th class="sortable" data-key="suplier_utama">Suplier Utama</th>
                <th>Aksi</th>

            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
<div id="pagination" class="pagination">
    <button id="prevPage" class="page-btn">Prev</button>
    <span id="pageNumbers"></span>
    <button id="nextPage" class="page-btn">Next</button>
</div>


<!-- Modal Edit -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Data Barang</h3>

    <form id="editForm">
        <input type="text" id="edit_kode_barang" placeholder="Kode Barang" required>
        <input type="text" id="edit_nama_barang" placeholder="Nama Barang" required>
        <input type="number" id="edit_harga_perolehan" placeholder="Harga Perolehan" required>
        <input type="number" id="edit_harga_jual" placeholder="Harga Jual" required>
        <input type="number" id="edit_jumlah_stock" placeholder="Jumlah Stock" required>
        <input type="text" id="edit_suplier_utama" placeholder="Suplier Utama" required>

        <button type="submit" class="save-btn">Simpan Perubahan</button>
        <button type="button" class="close-btn" onclick="tutupModal()">Batal</button>
    </form>
  </div>
  
</div>

<script src="/assets/JS/script.js"></script>
<div id="toastContainer"></div>

</body>
</html>
